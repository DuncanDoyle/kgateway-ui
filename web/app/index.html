<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>kgateway</title>
    <script>
      // Paint the theme background before React loads, so there is no colour flash.
      // Mirrors readStoredTheme: only known theme ids count, anything else follows the OS.
      (() => {
        var id = null;
        try {
          id = localStorage.getItem("kgateway-ui.theme");
        } catch {
          // storage blocked: fall back to the OS preference
        }
        var light;
        if (id === "control-room-light") light = true;
        else if (id === "control-room-dark") light = false;
        else light = window.matchMedia("(prefers-color-scheme: light)").matches;
        var root = document.documentElement;
        root.style.background = light ? "#FFFFFF" : "#0F1220";
        root.style.colorScheme = light ? "light" : "dark";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
