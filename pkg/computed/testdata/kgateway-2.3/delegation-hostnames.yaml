# Child hostnames are checked after the fit (rules §5.4): fits sets hostnames and fits /a, so it
# is rejected (UnsupportedValue); no-fit sets hostnames and fails the fit, so it is dropped.
# No valid child, so r gets ResolvedRefs=False/BackendNotFound.
provenance: computed-rules §5.4, §11.2
ruleOnly: true
controllerVersion: v2.3.11
namespaces: {infra: {}, h: {}}
objects:
- apiVersion: gateway.networking.k8s.io/v1
  kind: Gateway
  metadata: {name: gw, namespace: infra}
  spec:
    gatewayClassName: kgateway
    listeners:
    - {name: http, protocol: HTTP, port: 80, allowedRoutes: {namespaces: {from: All}}}
- apiVersion: gateway.networking.k8s.io/v1
  kind: HTTPRoute
  metadata: {name: r, namespace: infra}
  spec:
    parentRefs: [{name: gw}]
    rules:
    - matches: [{path: {type: PathPrefix, value: /a}}]
      backendRefs: [{group: gateway.networking.k8s.io, kind: HTTPRoute, name: "*", namespace: h}]
- {apiVersion: gateway.networking.k8s.io/v1, kind: HTTPRoute, metadata: {name: fits, namespace: h},
  spec: {hostnames: [fits.example.com], rules: [{matches: [{path: {type: PathPrefix, value: /a/1}}]}]}}
- {apiVersion: gateway.networking.k8s.io/v1, kind: HTTPRoute, metadata: {name: no-fit, namespace: h},
  spec: {hostnames: [nofit.example.com], rules: [{matches: [{path: {type: PathPrefix, value: /b/1}}]}]}}
expect:
  listeners:
    Gateway infra/gw http: {count: 1}
  parentRefs:
    "HTTPRoute infra/r #0": {outcome: accepted}
  rows:
    infra/r 0.0 h/fits: {outcome: rejected-hostnames}
    infra/r 0.0 h/no-fit: {outcome: dropped, reason: path-prefix}
  entries:
    "h/fits {group: gateway.networking.k8s.io, kind: HTTPRoute, name: r, namespace: infra}": UnsupportedValue
  signals:
    "infra/r {name: gw}": [BackendNotFound]
  effective:
    h/fits <- infra/r: {contexts: [r0 PathPrefix /a/1]}
    h/no-fit <- infra/r: {contexts: [r0 dropped path-prefix]}
