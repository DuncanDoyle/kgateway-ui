# Experimental setting true: TCPRoute v1alpha2 (experimental-only on both minors) and v1
# (experimental-only on 2.3) are both candidates.
provenance: computed-rules §4.2, §11.1
controllerVersion: v2.3.11
settings:
  KGW_ENABLE_EXPERIMENTAL_GATEWAY_API_FEATURES: "true"
namespaces:
  infra: {}
objects:
- apiVersion: gateway.networking.k8s.io/v1
  kind: Gateway
  metadata: {name: gw, namespace: infra}
  spec:
    gatewayClassName: kgateway
    listeners:
    - {name: tcp, protocol: TCP, port: 9000}
    - {name: http, protocol: HTTP, port: 80}
- apiVersion: gateway.networking.k8s.io/v1alpha2
  kind: TCPRoute
  metadata: {name: c, namespace: infra}
  spec:
    parentRefs: [{name: gw}]
- apiVersion: gateway.networking.k8s.io/v1
  kind: TCPRoute
  metadata: {name: c1, namespace: infra}
  spec:
    parentRefs: [{name: gw}]
- apiVersion: gateway.networking.k8s.io/v1
  kind: HTTPRoute
  metadata: {name: h, namespace: infra}
  spec:
    parentRefs: [{name: gw}]
expect:
  listeners:
    Gateway infra/gw tcp: {count: 2}
    Gateway infra/gw http: {count: 1}
  parentRefs:
    "TCPRoute infra/c #0": {outcome: accepted, listeners: [tcp]}
    "TCPRoute infra/c1 #0": {outcome: accepted, listeners: [tcp]}
    "HTTPRoute infra/h #0": {outcome: accepted, listeners: [http]}
