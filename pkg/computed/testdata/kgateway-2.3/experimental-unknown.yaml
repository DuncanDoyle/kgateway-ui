# Experimental setting unknown (valueFrom): every experimental-only route, and the listener
# it could count on, is unknown.
# Status is hand-written to agree with view A (rules §8.3).
# tcp has no status entry: its count depends on the unknown setting.
provenance: computed-rules §3.3, §4.2, §11.1
controllerVersion: v2.3.11
settings:
  KGW_ENABLE_EXPERIMENTAL_GATEWAY_API_FEATURES: <valueFrom>
namespaces:
  infra: {}
objects:
- apiVersion: gateway.networking.k8s.io/v1
  kind: Gateway
  metadata: {name: gw, namespace: infra}
  spec:
    gatewayClassName: kgateway
    listeners:
    - {name: tcp, protocol: TCP, port: 9000}
    - {name: http, protocol: HTTP, port: 80}
  status:
    listeners:
    - name: http
      attachedRoutes: 1
      conditions:
      - {type: Accepted, status: "True", reason: Accepted, observedGeneration: 1}
- apiVersion: gateway.networking.k8s.io/v1alpha2
  kind: TCPRoute
  metadata: {name: c, namespace: infra}
  spec:
    parentRefs: [{name: gw}]
- apiVersion: gateway.networking.k8s.io/v1
  kind: TCPRoute
  metadata: {name: c1, namespace: infra}
  spec:
    parentRefs: [{name: gw}]
- apiVersion: gateway.networking.k8s.io/v1
  kind: HTTPRoute
  metadata: {name: h, namespace: infra}
  spec:
    parentRefs: [{name: gw}]
  status:
    parents:
    - controllerName: kgateway.dev/kgateway
      parentRef: {name: gw}
      conditions:
      - {type: Accepted, status: "True", reason: Accepted, observedGeneration: 1}
expect:
  listeners:
    Gateway infra/gw tcp: {count: 0, unknown: setting-unknown}
    Gateway infra/gw http: {count: 1}
  parentRefs:
    "TCPRoute infra/c #0": {unknown: setting-unknown}
    "TCPRoute infra/c1 #0": {unknown: setting-unknown}
    "HTTPRoute infra/h #0": {outcome: accepted, listeners: [http]}
  checks:
    Gateway infra/gw tcp: {state: unknown}
    Gateway infra/gw http: {state: checked, coverage: [count-agrees]}
    "TCPRoute infra/c #0": {state: unknown}
    "TCPRoute infra/c1 #0": {state: unknown}
    "HTTPRoute infra/h #0": {state: checked, coverage: [status-compatible]}
  kgwui012: []
