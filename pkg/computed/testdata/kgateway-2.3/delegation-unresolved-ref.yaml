# Input: translator/gateway/testutils/inputs/delegation/unresolved_ref.yaml@v2.3.11 with its common.yaml, the
# Services left out. Status is copied from the output, with controllerName kgateway.dev/kgateway
# and without kgateway.dev/Programmed. Wildcard refs to namespaces b and a-c select nothing: one
# unresolved row each, no child, and ResolvedRefs=False/BackendNotFound on example-route and route-a.
# /b and /a/c are 500s in the output's Routes.
provenance: translator/gateway/testutils/outputs/delegation/unresolved_ref.yaml@v2.3.11
ruleOnly: true
controllerVersion: v2.3.11
namespaces:
  a: {}
  a-b: {}
  infra: {}
objects:
  - apiVersion: gateway.networking.k8s.io/v1
    kind: Gateway
    metadata:
      name: example-gateway
      namespace: infra
    spec:
      gatewayClassName: example-gateway-class
      listeners:
        - name: http
          protocol: HTTP
          port: 80
          allowedRoutes:
            namespaces:
              from: All
    status:
      conditions:
        - type: Accepted
          status: "True"
          reason: Accepted
          observedGeneration: 1
      listeners:
        - name: http
          attachedRoutes: 1
          conditions:
            - type: Accepted
              status: "True"
              reason: Accepted
              observedGeneration: 1
  - apiVersion: gateway.networking.k8s.io/v1
    kind: HTTPRoute
    metadata:
      name: example-route
      namespace: infra
    spec:
      parentRefs:
        - name: example-gateway
      hostnames:
        - example.com
      rules:
        - backendRefs:
            - name: example-svc
              port: 80
        - matches:
            - path:
                type: PathPrefix
                value: /a
          backendRefs:
            - group: gateway.networking.k8s.io
              kind: HTTPRoute
              name: '*'
              namespace: a
        - matches:
            - path:
                type: PathPrefix
                value: /b
          backendRefs:
            - group: gateway.networking.k8s.io
              kind: HTTPRoute
              name: '*'
              namespace: b
    status:
      parents:
        - controllerName: kgateway.dev/kgateway
          parentRef:
            name: example-gateway
          conditions:
            - type: ResolvedRefs
              status: "False"
              reason: BackendNotFound
              observedGeneration: 1
            - type: Accepted
              status: "True"
              reason: Accepted
              observedGeneration: 1
  - apiVersion: gateway.networking.k8s.io/v1
    kind: HTTPRoute
    metadata:
      name: route-a
      namespace: a
    spec:
      rules:
        - matches:
            - path:
                type: PathPrefix
                value: /a/1
          backendRefs:
            - name: svc-a
              port: 8080
        - matches:
            - path:
                type: PathPrefix
                value: /a/b
          backendRefs:
            - group: gateway.networking.k8s.io
              kind: HTTPRoute
              name: route-a-b
              namespace: a-b
        - matches:
            - path:
                type: PathPrefix
                value: /a/c
          backendRefs:
            - group: gateway.networking.k8s.io
              kind: HTTPRoute
              namespace: a-c
    status:
      parents:
        - controllerName: kgateway.dev/kgateway
          parentRef:
            group: gateway.networking.k8s.io
            kind: HTTPRoute
            name: example-route
            namespace: infra
          conditions:
            - type: ResolvedRefs
              status: "False"
              reason: BackendNotFound
              observedGeneration: 1
            - type: Accepted
              status: "True"
              reason: Accepted
              observedGeneration: 1
  - apiVersion: gateway.networking.k8s.io/v1
    kind: HTTPRoute
    metadata:
      name: route-a-b
      namespace: a-b
    spec:
      rules:
        - matches:
            - path:
                type: PathPrefix
                value: /a/b/1
          backendRefs:
            - name: svc-a-b
              port: 8080
    status:
      parents:
        - controllerName: kgateway.dev/kgateway
          parentRef:
            group: gateway.networking.k8s.io
            kind: HTTPRoute
            name: route-a
            namespace: a
          conditions:
            - type: Accepted
              status: "True"
              reason: Accepted
              observedGeneration: 1
            - type: ResolvedRefs
              status: "True"
              reason: ResolvedRefs
              observedGeneration: 1
expect:
  listeners:
    Gateway infra/example-gateway http: {count: 1}
  parentRefs:
    "HTTPRoute infra/example-route #0": {outcome: accepted}
  rows:
    infra/example-route 1.0 a/route-a: {outcome: attached}
    infra/example-route 2.0 -: {outcome: unresolved}
    a/route-a 1.0 a-b/route-a-b: {outcome: attached}
    a/route-a 2.0 -: {outcome: unresolved}
  entries:
    "a/route-a {group: gateway.networking.k8s.io, kind: HTTPRoute, name: example-route, namespace: infra}": Accepted
    "a-b/route-a-b {group: gateway.networking.k8s.io, kind: HTTPRoute, name: route-a, namespace: a}": Accepted
  signals:
    "infra/example-route {name: example-gateway}": [BackendNotFound]
    "a/route-a {group: gateway.networking.k8s.io, kind: HTTPRoute, name: example-route, namespace: infra}": [BackendNotFound]
  effective:
    a/route-a <- infra/example-route: {contexts: [r0 PathPrefix /a/1; r1 PathPrefix /a/b; r2 PathPrefix /a/c]}
    a-b/route-a-b <- a/route-a: {contexts: [r0 PathPrefix /a/b/1]}
