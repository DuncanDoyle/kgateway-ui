# Every hostname case of rules §4.3. Refs without sectionName match several listeners and
# get separate effective hostnames per listener. Listeners use distinct ports.
provenance: computed-rules §4.3, §11.1
controllerVersion: v2.3.11
namespaces:
  infra: {}
  apps: {}
objects:
- apiVersion: gateway.networking.k8s.io/v1
  kind: Gateway
  metadata: {name: gw, namespace: infra}
  spec:
    gatewayClassName: kgateway
    listeners:
    - {name: none, protocol: HTTP, port: 80, allowedRoutes: {namespaces: {from: All}}}
    - {name: exact, protocol: HTTP, port: 81, hostname: foo.example.com, allowedRoutes: {namespaces: {from: All}}}
    - {name: wild, protocol: HTTP, port: 82, hostname: "*.example.com", allowedRoutes: {namespaces: {from: All}}}
    - {name: deep-wild, protocol: HTTP, port: 83, hostname: "*.a.example.com", allowedRoutes: {namespaces: {from: All}}}
# No route hostnames: the listener's hostname, or none.
- apiVersion: gateway.networking.k8s.io/v1
  kind: HTTPRoute
  metadata: {name: r-nohost, namespace: apps}
  spec:
    parentRefs: [{name: gw, namespace: infra}]
# Duplicates are kept as written on a listener without hostname, removed when intersecting.
- apiVersion: gateway.networking.k8s.io/v1
  kind: HTTPRoute
  metadata: {name: r-dup, namespace: apps}
  spec:
    parentRefs: [{name: gw, namespace: infra}]
    hostnames: [foo.example.com, foo.example.com]
# Two exact names must be equal; a *.x listener takes an exact name in .x.
- apiVersion: gateway.networking.k8s.io/v1
  kind: HTTPRoute
  metadata: {name: r-exact, namespace: apps}
  spec:
    parentRefs: [{name: gw, namespace: infra}]
    hostnames: [foo.example.com, bar.example.com]
# A *.x listener matches an exact name at any depth.
- apiVersion: gateway.networking.k8s.io/v1
  kind: HTTPRoute
  metadata: {name: r-deep, namespace: apps}
  spec:
    parentRefs: [{name: gw, namespace: infra}]
    hostnames: [x.y.example.com]
# A wildcard route: an exact listener in .x gives the listener's; two wildcards give the more specific.
- apiVersion: gateway.networking.k8s.io/v1
  kind: HTTPRoute
  metadata: {name: r-wild, namespace: apps}
  spec:
    parentRefs: [{name: gw, namespace: infra}]
    hostnames: ["*.example.com"]
- apiVersion: gateway.networking.k8s.io/v1
  kind: HTTPRoute
  metadata: {name: r-miss, namespace: apps}
  spec:
    parentRefs: [{name: gw, namespace: infra, sectionName: exact}]
    hostnames: [other.org]
expect:
  listeners:
    Gateway infra/gw none: {count: 5}
    Gateway infra/gw exact: {count: 4}
    Gateway infra/gw wild: {count: 5}
    Gateway infra/gw deep-wild: {count: 2}
  parentRefs:
    "HTTPRoute apps/r-nohost #0": {outcome: accepted, listeners: [none, exact, wild, deep-wild]}
    "HTTPRoute apps/r-dup #0": {outcome: accepted, listeners: [none, exact, wild]}
    "HTTPRoute apps/r-exact #0": {outcome: accepted, listeners: [none, exact, wild]}
    "HTTPRoute apps/r-deep #0": {outcome: accepted, listeners: [none, wild]}
    "HTTPRoute apps/r-wild #0": {outcome: accepted, listeners: [none, exact, wild, deep-wild]}
    "HTTPRoute apps/r-miss #0": {outcome: NoMatchingListenerHostname}
  members:
    "HTTPRoute apps/r-nohost #0 -> Gateway infra/gw none": []
    "HTTPRoute apps/r-nohost #0 -> Gateway infra/gw exact": [foo.example.com]
    "HTTPRoute apps/r-nohost #0 -> Gateway infra/gw wild": ["*.example.com"]
    "HTTPRoute apps/r-nohost #0 -> Gateway infra/gw deep-wild": ["*.a.example.com"]
    "HTTPRoute apps/r-dup #0 -> Gateway infra/gw none": [foo.example.com, foo.example.com]
    "HTTPRoute apps/r-dup #0 -> Gateway infra/gw exact": [foo.example.com]
    "HTTPRoute apps/r-dup #0 -> Gateway infra/gw wild": [foo.example.com]
    "HTTPRoute apps/r-exact #0 -> Gateway infra/gw none": [foo.example.com, bar.example.com]
    "HTTPRoute apps/r-exact #0 -> Gateway infra/gw exact": [foo.example.com]
    "HTTPRoute apps/r-exact #0 -> Gateway infra/gw wild": [foo.example.com, bar.example.com]
    "HTTPRoute apps/r-deep #0 -> Gateway infra/gw none": [x.y.example.com]
    "HTTPRoute apps/r-deep #0 -> Gateway infra/gw wild": [x.y.example.com]
    "HTTPRoute apps/r-wild #0 -> Gateway infra/gw none": ["*.example.com"]
    "HTTPRoute apps/r-wild #0 -> Gateway infra/gw exact": [foo.example.com]
    "HTTPRoute apps/r-wild #0 -> Gateway infra/gw wild": ["*.example.com"]
    "HTTPRoute apps/r-wild #0 -> Gateway infra/gw deep-wild": ["*.a.example.com"]
