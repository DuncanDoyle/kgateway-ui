# A cycle fails the whole ref (rules §5.4): p's wildcard ref selects p itself, on the path, and
# its sibling q, so both rows are cycle and p gets ResolvedRefs=False/RefNotPermitted under its
# key. p's entry is hand-written.
provenance: computed-rules §5.4, §11.2
ruleOnly: true
controllerVersion: v2.3.11
namespaces: {infra: {}, mid: {}}
objects:
- apiVersion: gateway.networking.k8s.io/v1
  kind: Gateway
  metadata: {name: gw, namespace: infra}
  spec:
    gatewayClassName: kgateway
    listeners:
    - {name: http, protocol: HTTP, port: 80, allowedRoutes: {namespaces: {from: All}}}
- apiVersion: gateway.networking.k8s.io/v1
  kind: HTTPRoute
  metadata: {name: r, namespace: infra}
  spec:
    parentRefs: [{name: gw}]
    rules:
    - matches: [{path: {type: PathPrefix, value: /a}}]
      backendRefs: [{group: gateway.networking.k8s.io, kind: HTTPRoute, name: p, namespace: mid}]
- apiVersion: gateway.networking.k8s.io/v1
  kind: HTTPRoute
  metadata: {name: p, namespace: mid}
  spec:
    rules:
    - matches: [{path: {type: PathPrefix, value: /a/x}}]
      backendRefs: [{group: gateway.networking.k8s.io, kind: HTTPRoute, name: "*", namespace: mid}]
  status: {parents: [{controllerName: kgateway.dev/kgateway, parentRef: {group: gateway.networking.k8s.io, kind: HTTPRoute, name: r, namespace: infra},
    conditions: [{type: Accepted, status: "True", reason: Accepted, observedGeneration: 1}]}]}
- {apiVersion: gateway.networking.k8s.io/v1, kind: HTTPRoute, metadata: {name: q, namespace: mid},
  spec: {rules: [{matches: [{path: {type: PathPrefix, value: /a/x/q}}]}]}}
expect:
  listeners:
    Gateway infra/gw http: {count: 1}
  parentRefs:
    "HTTPRoute infra/r #0": {outcome: accepted}
  rows:
    infra/r 0.0 mid/p: {outcome: attached}
    mid/p 0.0 mid/p: {outcome: cycle}
    mid/p 0.0 mid/q: {outcome: cycle}
  entries:
    "mid/p {group: gateway.networking.k8s.io, kind: HTTPRoute, name: r, namespace: infra}": Accepted
  signals:
    "mid/p {group: gateway.networking.k8s.io, kind: HTTPRoute, name: r, namespace: infra}": [RefNotPermitted]
  effective:
    mid/p <- infra/r: {contexts: [r0 PathPrefix /a/x]}
