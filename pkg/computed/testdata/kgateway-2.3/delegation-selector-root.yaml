# A root behind a Selector listener (rules §5.6): r is admitted through Namespace web's labels.
# Every context below r depends on r's eligibility set plus the routes on its path, so c's row
# and effective edge depend on that Namespace; a caller who may not view it gets them restricted
# (design §7.4). Status is hand-written to agree, the child's entry included.
provenance: computed-rules §5.6, §11.2
controllerVersion: v2.3.11
namespaces: {infra: {}, web: {team: web}, apps: {}}
objects:
- apiVersion: gateway.networking.k8s.io/v1
  kind: Gateway
  metadata: {name: gw, namespace: infra}
  spec:
    gatewayClassName: kgateway
    listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes: {namespaces: {from: Selector, selector: {matchLabels: {team: web}}}}
  status:
    listeners:
    - name: http
      attachedRoutes: 1
      conditions:
      - {type: Accepted, status: "True", reason: Accepted, observedGeneration: 1}
- apiVersion: gateway.networking.k8s.io/v1
  kind: HTTPRoute
  metadata: {name: r, namespace: web}
  spec:
    parentRefs: [{name: gw, namespace: infra}]
    rules:
    - matches: [{path: {type: PathPrefix, value: /w}}]
      backendRefs: [{group: gateway.networking.k8s.io, kind: HTTPRoute, name: c, namespace: apps}]
  status:
    parents:
    - controllerName: kgateway.dev/kgateway
      parentRef: {name: gw, namespace: infra}
      conditions:
      - {type: Accepted, status: "True", reason: Accepted, observedGeneration: 1}
- {apiVersion: gateway.networking.k8s.io/v1, kind: HTTPRoute, metadata: {name: c, namespace: apps},
  spec: {rules: [{matches: [{path: {type: PathPrefix, value: /w/c}}]}]},
  status: {parents: [{controllerName: kgateway.dev/kgateway, parentRef: {group: gateway.networking.k8s.io, kind: HTTPRoute, name: r, namespace: web},
    conditions: [{type: Accepted, status: "True", reason: Accepted, observedGeneration: 1}]}]}}
expect:
  listeners:
    Gateway infra/gw http: {count: 1}
  parentRefs:
    "HTTPRoute web/r #0": {outcome: accepted}
  checks:
    Gateway infra/gw http: {state: checked, coverage: [count-agrees]}
    "HTTPRoute web/r #0": {state: checked, coverage: [status-compatible]}
    web/r 0.0 apps/c: {state: checked, coverage: [status-compatible]}
  kgwui012: []
  kgwui011: []
  rows:
    web/r 0.0 apps/c: {outcome: attached, deps: [Namespace /web, Gateway infra/gw, HTTPRoute web/r]}
  entries:
    "apps/c {group: gateway.networking.k8s.io, kind: HTTPRoute, name: r, namespace: web}": Accepted
  effective:
    apps/c <- web/r: {contexts: [r0 PathPrefix /w/c]}
