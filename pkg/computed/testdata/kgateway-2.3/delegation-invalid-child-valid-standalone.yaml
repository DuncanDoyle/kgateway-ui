# Input: translator/gateway/testutils/inputs/delegation/invalid_child_valid_standalone.yaml@v2.3.11 with its common.yaml, the
# Services left out. Status is copied from the output, with controllerName kgateway.dev/kgateway
# and without kgateway.dev/Programmed. route-a is also a top-level route on the
# Gateway (attachedRoutes 2). As a child it fits /a but sets hostnames, so it is rejected under
# the parent and the parent gets ResolvedRefs=False/BackendNotFound.
provenance: translator/gateway/testutils/outputs/delegation/invalid_child_valid_standalone.yaml@v2.3.11
ruleOnly: true
controllerVersion: v2.3.11
namespaces:
  a: {}
  infra: {}
objects:
  - apiVersion: gateway.networking.k8s.io/v1
    kind: Gateway
    metadata:
      name: example-gateway
      namespace: infra
    spec:
      gatewayClassName: example-gateway-class
      listeners:
        - name: http
          protocol: HTTP
          port: 80
          allowedRoutes:
            namespaces:
              from: All
    status:
      conditions:
        - type: Accepted
          status: "True"
          reason: Accepted
          observedGeneration: 1
      listeners:
        - name: http
          attachedRoutes: 2
          conditions:
            - type: Accepted
              status: "True"
              reason: Accepted
              observedGeneration: 1
  - apiVersion: gateway.networking.k8s.io/v1
    kind: HTTPRoute
    metadata:
      name: example-route
      namespace: infra
    spec:
      parentRefs:
        - name: example-gateway
      hostnames:
        - example.com
      rules:
        - backendRefs:
            - name: example-svc
              port: 80
        - matches:
            - path:
                type: PathPrefix
                value: /a
          backendRefs:
            - group: gateway.networking.k8s.io
              kind: HTTPRoute
              name: '*'
              namespace: a
    status:
      parents:
        - controllerName: kgateway.dev/kgateway
          parentRef:
            name: example-gateway
          conditions:
            - type: ResolvedRefs
              status: "False"
              reason: BackendNotFound
              observedGeneration: 1
            - type: Accepted
              status: "True"
              reason: Accepted
              observedGeneration: 1
  - apiVersion: gateway.networking.k8s.io/v1
    kind: HTTPRoute
    metadata:
      name: route-a
      namespace: a
    spec:
      hostnames:
        - foo.com
      parentRefs:
        - name: example-gateway
          namespace: infra
          group: gateway.networking.k8s.io
          kind: Gateway
        - name: example-route
          namespace: infra
          group: gateway.networking.k8s.io
          kind: HTTPRoute
      rules:
        - matches:
            - path:
                type: PathPrefix
                value: /a/1
          backendRefs:
            - name: svc-a
              port: 8080
    status:
      parents:
        - controllerName: kgateway.dev/kgateway
          parentRef:
            group: gateway.networking.k8s.io
            kind: Gateway
            name: example-gateway
            namespace: infra
          conditions:
            - type: Accepted
              status: "True"
              reason: Accepted
              observedGeneration: 1
            - type: ResolvedRefs
              status: "True"
              reason: ResolvedRefs
              observedGeneration: 1
        - controllerName: kgateway.dev/kgateway
          parentRef:
            group: gateway.networking.k8s.io
            kind: HTTPRoute
            name: example-route
            namespace: infra
          conditions:
            - type: Accepted
              status: "False"
              reason: UnsupportedValue
              observedGeneration: 1
            - type: ResolvedRefs
              status: "True"
              reason: ResolvedRefs
              observedGeneration: 1
expect:
  listeners:
    Gateway infra/example-gateway http: {count: 2}
  parentRefs:
    "HTTPRoute infra/example-route #0": {outcome: accepted}
    "HTTPRoute a/route-a #0": {outcome: accepted}
  rows:
    infra/example-route 1.0 a/route-a: {outcome: rejected-hostnames}
  entries:
    "a/route-a {group: gateway.networking.k8s.io, kind: HTTPRoute, name: example-route, namespace: infra}": UnsupportedValue
  signals:
    "infra/example-route {name: example-gateway}": [BackendNotFound]
  effective:
    a/route-a <- infra/example-route: {contexts: [r0 PathPrefix /a/1]}
