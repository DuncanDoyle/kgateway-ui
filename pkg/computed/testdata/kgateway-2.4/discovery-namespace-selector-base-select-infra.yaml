# Input: translator/gateway/testutils/inputs/discovery-namespace-selector/base.yaml@v2.4.7, with
# the TrafficPolicies and Services left out. The controller watches only infra; route-a in a has
# no parentRefs, so it is never a candidate and never counts. Status is copied from the output.
provenance: translator/gateway/testutils/outputs/discovery-namespace-selector/base_select_infra.yaml@v2.4.7
controllerVersion: v2.4.7
settings:
  KGW_DISCOVERY_NAMESPACE_SELECTORS: '[{"matchLabels":{"kubernetes.io/metadata.name":"infra"}}]'
namespaces:
  infra: {kubernetes.io/metadata.name: infra}
  a: {kubernetes.io/metadata.name: a, app: a}
objects:
- apiVersion: gateway.networking.k8s.io/v1
  kind: Gateway
  metadata:
    name: example-gateway
    namespace: infra
    labels: {kubernetes.io/metadata.name: default}
  spec:
    gatewayClassName: example-gateway-class
    listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces: {from: All}
  status:
    conditions:
    - {type: Accepted, status: "True", reason: Accepted, observedGeneration: 1}
    - {type: Programmed, status: "True", reason: Programmed, observedGeneration: 1}
    listeners:
    - name: http
      attachedRoutes: 1
      conditions:
      - {type: Accepted, status: "True", reason: Accepted, observedGeneration: 1}
- apiVersion: gateway.networking.k8s.io/v1
  kind: HTTPRoute
  metadata: {name: example-route, namespace: infra}
  spec:
    parentRefs:
    - {name: example-gateway}
    hostnames: [example.com]
    rules:
    - backendRefs:
      - {name: example-svc, port: 80}
    - matches:
      - path: {type: PathPrefix, value: /a}
      backendRefs:
      - {group: gateway.networking.k8s.io, kind: HTTPRoute, name: "*", namespace: a}
  status:
    parents:
    - controllerName: kgateway.dev/kgateway
      parentRef: {group: "", kind: "", name: example-gateway}
      conditions:
      - {type: ResolvedRefs, status: "False", reason: BackendNotFound, observedGeneration: 1}
      - {type: Accepted, status: "True", reason: Accepted, observedGeneration: 1}
      - {type: kgateway.dev/Programmed, status: "True", reason: Programmed, observedGeneration: 1}
- apiVersion: gateway.networking.k8s.io/v1
  kind: HTTPRoute
  metadata: {name: route-a, namespace: a}
  spec:
    rules:
    - matches:
      - path: {type: PathPrefix, value: /a/1}
      backendRefs:
      - {name: svc-a, port: 8080}
expect:
  listeners:
    Gateway infra/example-gateway http: {count: 1}
  parentRefs:
    "HTTPRoute infra/example-route #0": {outcome: accepted}
  checks:
    Gateway infra/example-gateway http: {state: checked, coverage: [count-agrees]}
    "HTTPRoute infra/example-route #0": {state: checked, coverage: [status-compatible]}
  kgwui012: []
