# Input: translator/gateway/testutils/inputs/delegation/multiple_children.yaml@v2.4.7 with its common.yaml, the
# Services left out. Status is copied from the output, with controllerName kgateway.dev/kgateway
# and without kgateway.dev/Programmed. Children in two namespaces, Exact and RegularExpression
# paths under PathPrefix parents, both attached.
provenance: translator/gateway/testutils/outputs/delegation/multiple_children.yaml@v2.4.7
ruleOnly: true
controllerVersion: v2.4.7
namespaces:
  a: {}
  b: {}
  infra: {}
objects:
  - apiVersion: gateway.networking.k8s.io/v1
    kind: Gateway
    metadata:
      name: example-gateway
      namespace: infra
    spec:
      gatewayClassName: example-gateway-class
      listeners:
        - name: http
          protocol: HTTP
          port: 80
          allowedRoutes:
            namespaces:
              from: All
    status:
      conditions:
        - type: Accepted
          status: "True"
          reason: Accepted
          observedGeneration: 1
      listeners:
        - name: http
          attachedRoutes: 1
          conditions:
            - type: Accepted
              status: "True"
              reason: Accepted
              observedGeneration: 1
  - apiVersion: gateway.networking.k8s.io/v1
    kind: HTTPRoute
    metadata:
      name: example-route
      namespace: infra
    spec:
      parentRefs:
        - name: example-gateway
      hostnames:
        - example.com
      rules:
        - backendRefs:
            - name: example-svc
              port: 80
        - matches:
            - path:
                type: PathPrefix
                value: /a
          backendRefs:
            - group: gateway.networking.k8s.io
              kind: HTTPRoute
              name: '*'
              namespace: a
        - matches:
            - path:
                type: PathPrefix
                value: /b
          backendRefs:
            - group: gateway.networking.k8s.io
              kind: HTTPRoute
              name: '*'
              namespace: b
    status:
      parents:
        - controllerName: kgateway.dev/kgateway
          parentRef:
            name: example-gateway
          conditions:
            - type: Accepted
              status: "True"
              reason: Accepted
              observedGeneration: 1
            - type: ResolvedRefs
              status: "True"
              reason: ResolvedRefs
              observedGeneration: 1
  - apiVersion: gateway.networking.k8s.io/v1
    kind: HTTPRoute
    metadata:
      name: route-a
      namespace: a
    spec:
      rules:
        - matches:
            - path:
                type: Exact
                value: /a/1
          backendRefs:
            - name: svc-a
              port: 8080
    status:
      parents:
        - controllerName: kgateway.dev/kgateway
          parentRef:
            group: gateway.networking.k8s.io
            kind: HTTPRoute
            name: example-route
            namespace: infra
          conditions:
            - type: Accepted
              status: "True"
              reason: Accepted
              observedGeneration: 1
            - type: ResolvedRefs
              status: "True"
              reason: ResolvedRefs
              observedGeneration: 1
  - apiVersion: gateway.networking.k8s.io/v1
    kind: HTTPRoute
    metadata:
      name: route-b
      namespace: b
    spec:
      rules:
        - matches:
            - path:
                type: RegularExpression
                value: /b/.*
          backendRefs:
            - name: svc-b
              port: 8080
    status:
      parents:
        - controllerName: kgateway.dev/kgateway
          parentRef:
            group: gateway.networking.k8s.io
            kind: HTTPRoute
            name: example-route
            namespace: infra
          conditions:
            - type: Accepted
              status: "True"
              reason: Accepted
              observedGeneration: 1
            - type: ResolvedRefs
              status: "True"
              reason: ResolvedRefs
              observedGeneration: 1
expect:
  listeners:
    Gateway infra/example-gateway http: {count: 1}
  parentRefs:
    "HTTPRoute infra/example-route #0": {outcome: accepted}
  rows:
    infra/example-route 1.0 a/route-a: {outcome: attached}
    infra/example-route 2.0 b/route-b: {outcome: attached}
  entries:
    "a/route-a {group: gateway.networking.k8s.io, kind: HTTPRoute, name: example-route, namespace: infra}": Accepted
    "b/route-b {group: gateway.networking.k8s.io, kind: HTTPRoute, name: example-route, namespace: infra}": Accepted
  effective:
    a/route-a <- infra/example-route: {contexts: [r0 Exact /a/1]}
    b/route-b <- infra/example-route: {contexts: [r0 RegularExpression /b/.*]}
