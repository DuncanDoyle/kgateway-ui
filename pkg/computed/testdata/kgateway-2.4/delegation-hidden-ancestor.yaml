# An ancestor route between a root and a child (D-024): c's context carries the path with each
# ancestor's name and the match it delegated under, and depends on r's eligibility set and the
# routes on the path. A caller who cannot see p still gets c's row with p's name and match only
# (design §7.4 rule 4b). p's entry is hand-written.
provenance: computed-rules §5.6, §11.2
ruleOnly: true
controllerVersion: v2.4.7
namespaces: {infra: {}, mid: {}, leaf: {}}
objects:
- apiVersion: gateway.networking.k8s.io/v1
  kind: Gateway
  metadata: {name: gw, namespace: infra}
  spec:
    gatewayClassName: kgateway
    listeners:
    - {name: http, protocol: HTTP, port: 80, allowedRoutes: {namespaces: {from: All}}}
- apiVersion: gateway.networking.k8s.io/v1
  kind: HTTPRoute
  metadata: {name: r, namespace: infra}
  spec:
    parentRefs: [{name: gw}]
    rules:
    - matches: [{path: {type: PathPrefix, value: /a}}]
      backendRefs: [{group: gateway.networking.k8s.io, kind: HTTPRoute, name: p, namespace: mid}]
- apiVersion: gateway.networking.k8s.io/v1
  kind: HTTPRoute
  metadata: {name: p, namespace: mid}
  spec:
    rules:
    - matches: [{path: {type: PathPrefix, value: /a/b}}]
      backendRefs: [{group: gateway.networking.k8s.io, kind: HTTPRoute, name: c, namespace: leaf}]
  status: {parents: [{controllerName: kgateway.dev/kgateway, parentRef: {group: gateway.networking.k8s.io, kind: HTTPRoute, name: r, namespace: infra},
    conditions: [{type: Accepted, status: "True", reason: Accepted, observedGeneration: 1}]}]}
- {apiVersion: gateway.networking.k8s.io/v1, kind: HTTPRoute, metadata: {name: c, namespace: leaf},
  spec: {rules: [{matches: [{path: {type: PathPrefix, value: /a/b/c}}]}]}}
expect:
  listeners:
    Gateway infra/gw http: {count: 1}
  parentRefs:
    "HTTPRoute infra/r #0": {outcome: accepted}
  rows:
    infra/r 0.0 mid/p: {outcome: attached}
    mid/p 0.0 leaf/c:
      outcome: attached
      paths: [infra/r PathPrefix /a > mid/p PathPrefix /a/b]
      deps: [Gateway infra/gw, HTTPRoute infra/r, HTTPRoute mid/p]
  entries:
    "mid/p {group: gateway.networking.k8s.io, kind: HTTPRoute, name: r, namespace: infra}": Accepted
    "leaf/c {group: gateway.networking.k8s.io, kind: HTTPRoute, name: p, namespace: mid}": Accepted
  effective:
    mid/p <- infra/r: {contexts: [r0 PathPrefix /a/b]}
    leaf/c <- mid/p: {contexts: [r0 PathPrefix /a/b/c]}
