# Experimental setting false: on 2.4 TCPRoute v1 is watched regardless, so only c1 is a
# candidate; v1alpha2 stays experimental-only.
provenance: computed-rules §4.2, §11.1
controllerVersion: v2.4.7
settings:
  KGW_ENABLE_EXPERIMENTAL_GATEWAY_API_FEATURES: "false"
namespaces:
  infra: {}
objects:
- apiVersion: gateway.networking.k8s.io/v1
  kind: Gateway
  metadata: {name: gw, namespace: infra}
  spec:
    gatewayClassName: kgateway
    listeners:
    - {name: tcp, protocol: TCP, port: 9000}
    - {name: http, protocol: HTTP, port: 80}
- apiVersion: gateway.networking.k8s.io/v1alpha2
  kind: TCPRoute
  metadata: {name: c, namespace: infra}
  spec:
    parentRefs: [{name: gw}]
- apiVersion: gateway.networking.k8s.io/v1
  kind: TCPRoute
  metadata: {name: c1, namespace: infra}
  spec:
    parentRefs: [{name: gw}]
- apiVersion: gateway.networking.k8s.io/v1
  kind: HTTPRoute
  metadata: {name: h, namespace: infra}
  spec:
    parentRefs: [{name: gw}]
expect:
  listeners:
    Gateway infra/gw tcp: {count: 1}
    Gateway infra/gw http: {count: 1}
  parentRefs:
    "TCPRoute infra/c1 #0": {outcome: accepted, listeners: [tcp]}
    "HTTPRoute infra/h #0": {outcome: accepted, listeners: [http]}
