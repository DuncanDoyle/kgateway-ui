# Namespace access unavailable with a Selector listener: the Selector listener's count and every
# ref it could decide are unknown; the Same listener keeps its known count and member.
# Status is hand-written to agree with view A (rules §8.3).
# sel has no status entry: its count depends on labels the UI cannot read.
provenance: computed-rules §3.3, §11.1
controllerVersion: v2.4.7
namespacesOK: false
objects:
- apiVersion: gateway.networking.k8s.io/v1
  kind: Gateway
  metadata: {name: gw, namespace: infra}
  spec:
    gatewayClassName: kgateway
    listeners:
    - {name: same, protocol: HTTP, port: 80}
    - {name: sel, protocol: HTTP, port: 81, allowedRoutes: {namespaces: {from: Selector, selector: {matchLabels: {team: web}}}}}
  status:
    listeners:
    - name: same
      attachedRoutes: 1
      conditions:
      - {type: Accepted, status: "True", reason: Accepted, observedGeneration: 1}
- apiVersion: gateway.networking.k8s.io/v1
  kind: HTTPRoute
  metadata: {name: r, namespace: infra}
  spec:
    parentRefs: [{name: gw}]
- apiVersion: gateway.networking.k8s.io/v1
  kind: HTTPRoute
  metadata: {name: a, namespace: apps}
  spec:
    parentRefs: [{name: gw, namespace: infra, sectionName: sel}]
expect:
  listeners:
    Gateway infra/gw same: {count: 1}
    Gateway infra/gw sel: {count: 0, unknown: namespace-labels-unavailable}
  parentRefs:
    "HTTPRoute infra/r #0": {unknown: namespace-labels-unavailable}
    "HTTPRoute apps/a #0": {unknown: namespace-labels-unavailable}
  members:
    "HTTPRoute infra/r #0 -> Gateway infra/gw same": []
  checks:
    Gateway infra/gw same: {state: checked, coverage: [count-agrees]}
    Gateway infra/gw sel: {state: unknown}
    "HTTPRoute infra/r #0": {state: unknown}
    "HTTPRoute apps/a #0": {state: unknown}
  kgwui012: []
