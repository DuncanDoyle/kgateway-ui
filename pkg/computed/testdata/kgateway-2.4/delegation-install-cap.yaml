# A row with no contexts kept at the install cap (rules §5.7, bounds ContextsPerInstall 1): c's
# context is the install's only retained one, so d's row keeps none and is contextsTruncated, and
# d's effective edge is sent as contexts [] with contextsTruncated, never as complete.
# Status is hand-written to agree (rules §8.3), the children's entries included.
provenance: computed-rules §5.7, §11.2
controllerVersion: v2.4.7
bounds: {ContextsPerInstall: 1}
namespaces: {infra: {}, apps: {}}
objects:
- apiVersion: gateway.networking.k8s.io/v1
  kind: Gateway
  metadata: {name: gw, namespace: infra}
  spec:
    gatewayClassName: kgateway
    listeners:
    - {name: http, protocol: HTTP, port: 80, allowedRoutes: {namespaces: {from: All}}}
  status:
    listeners:
    - name: http
      attachedRoutes: 1
      conditions:
      - {type: Accepted, status: "True", reason: Accepted, observedGeneration: 1}
- apiVersion: gateway.networking.k8s.io/v1
  kind: HTTPRoute
  metadata: {name: r, namespace: infra}
  spec:
    parentRefs: [{name: gw}]
    rules:
    - matches: [{path: {type: PathPrefix, value: /a}}]
      backendRefs: [{group: gateway.networking.k8s.io, kind: HTTPRoute, name: c, namespace: apps}]
    - matches: [{path: {type: PathPrefix, value: /b}}]
      backendRefs: [{group: gateway.networking.k8s.io, kind: HTTPRoute, name: d, namespace: apps}]
  status:
    parents:
    - controllerName: kgateway.dev/kgateway
      parentRef: {name: gw}
      conditions:
      - {type: Accepted, status: "True", reason: Accepted, observedGeneration: 1}
- {apiVersion: gateway.networking.k8s.io/v1, kind: HTTPRoute, metadata: {name: c, namespace: apps},
  spec: {rules: [{matches: [{path: {type: PathPrefix, value: /a/c}}]}]},
  status: {parents: [{controllerName: kgateway.dev/kgateway, parentRef: {group: gateway.networking.k8s.io, kind: HTTPRoute, name: r, namespace: infra},
    conditions: [{type: Accepted, status: "True", reason: Accepted, observedGeneration: 1}]}]}}
- {apiVersion: gateway.networking.k8s.io/v1, kind: HTTPRoute, metadata: {name: d, namespace: apps},
  spec: {rules: [{matches: [{path: {type: PathPrefix, value: /b/d}}]}]},
  status: {parents: [{controllerName: kgateway.dev/kgateway, parentRef: {group: gateway.networking.k8s.io, kind: HTTPRoute, name: r, namespace: infra},
    conditions: [{type: Accepted, status: "True", reason: Accepted, observedGeneration: 1}]}]}}
expect:
  listeners:
    Gateway infra/gw http: {count: 1}
  parentRefs:
    "HTTPRoute infra/r #0": {outcome: accepted}
  checks:
    Gateway infra/gw http: {state: checked, coverage: [count-agrees]}
    "HTTPRoute infra/r #0": {state: checked, coverage: [status-compatible]}
    infra/r 0.0 apps/c: {state: checked, coverage: [status-compatible]}
    infra/r 1.0 apps/d: {state: checked, coverage: [status-compatible]}
  kgwui012: []
  kgwui011: []
  rows:
    infra/r 0.0 apps/c: {outcome: attached, contexts: 1}
    infra/r 1.0 apps/d: {outcome: attached, contexts: 0, contextsTruncated: true}
  entries:
    "apps/c {group: gateway.networking.k8s.io, kind: HTTPRoute, name: r, namespace: infra}": Accepted
    "apps/d {group: gateway.networking.k8s.io, kind: HTTPRoute, name: r, namespace: infra}": Accepted
  effective:
    apps/c <- infra/r: {contexts: [r0 PathPrefix /a/c]}
    apps/d <- infra/r: {contexts: [], contextsTruncated: true}
