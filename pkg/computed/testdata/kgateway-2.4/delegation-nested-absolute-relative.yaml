# Input: translator/gateway/testutils/inputs/delegation/nested_absolute_relative.yaml@v2.4.7 with its common.yaml, the
# Services left out. Status is copied from the output, with controllerName kgateway.dev/kgateway
# and without kgateway.dev/Programmed. Three levels: route-a fits the parent's match,
# route-a-b inherits route-a's effective /a/b match (with its GET), and route-a-b-d is fitted
# against route-a-b's merged /a/b/d match, as the output's Routes show.
provenance: translator/gateway/testutils/outputs/delegation/nested_absolute_relative.yaml@v2.4.7
ruleOnly: true
controllerVersion: v2.4.7
namespaces:
  a: {}
  a-b: {}
  a-b-d: {}
  infra: {}
objects:
  - apiVersion: gateway.networking.k8s.io/v1
    kind: Gateway
    metadata:
      name: example-gateway
      namespace: infra
    spec:
      gatewayClassName: example-gateway-class
      listeners:
        - name: http
          protocol: HTTP
          port: 80
          allowedRoutes:
            namespaces:
              from: All
    status:
      conditions:
        - type: Accepted
          status: "True"
          reason: Accepted
          observedGeneration: 1
      listeners:
        - name: http
          attachedRoutes: 1
          conditions:
            - type: Accepted
              status: "True"
              reason: Accepted
              observedGeneration: 1
  - apiVersion: gateway.networking.k8s.io/v1
    kind: HTTPRoute
    metadata:
      name: example-route
      namespace: infra
    spec:
      parentRefs:
        - name: example-gateway
      hostnames:
        - example.com
      rules:
        - matches:
            - path:
                type: PathPrefix
                value: /a
              headers:
                - type: Exact
                  name: parent-header
                  value: parent-header-val
              queryParams:
                - type: Exact
                  name: parent-query
                  value: parent-query-val
          backendRefs:
            - group: gateway.networking.k8s.io
              kind: HTTPRoute
              name: '*'
              namespace: a
    status:
      parents:
        - controllerName: kgateway.dev/kgateway
          parentRef:
            name: example-gateway
          conditions:
            - type: Accepted
              status: "True"
              reason: Accepted
              observedGeneration: 1
            - type: ResolvedRefs
              status: "True"
              reason: ResolvedRefs
              observedGeneration: 1
  - apiVersion: gateway.networking.k8s.io/v1
    kind: HTTPRoute
    metadata:
      name: route-a
      namespace: a
    spec:
      rules:
        - matches:
            - path:
                type: PathPrefix
                value: /a/1
              headers:
                - type: Exact
                  name: parent-header
                  value: parent-header-val
                - type: Exact
                  name: route-a-header
                  value: route-a-header-val
              queryParams:
                - type: Exact
                  name: parent-query
                  value: parent-query-val
                - type: Exact
                  name: route-a-query
                  value: route-a-query-val
          backendRefs:
            - name: svc-a
              port: 8080
        - matches:
            - path:
                type: PathPrefix
                value: /a/b
              headers:
                - type: Exact
                  name: parent-header
                  value: parent-header-val
              queryParams:
                - type: Exact
                  name: parent-query
                  value: parent-query-val
              method: GET
          backendRefs:
            - group: gateway.networking.k8s.io
              kind: HTTPRoute
              name: route-a-b
              namespace: a-b
    status:
      parents:
        - controllerName: kgateway.dev/kgateway
          parentRef:
            group: gateway.networking.k8s.io
            kind: HTTPRoute
            name: example-route
            namespace: infra
          conditions:
            - type: Accepted
              status: "True"
              reason: Accepted
              observedGeneration: 1
            - type: ResolvedRefs
              status: "True"
              reason: ResolvedRefs
              observedGeneration: 1
  - apiVersion: gateway.networking.k8s.io/v1
    kind: HTTPRoute
    metadata:
      name: route-a-b
      namespace: a-b
      annotations:
        delegation.kgateway.dev/inherit-parent-matcher: "true"
    spec:
      rules:
        - matches:
            - path:
                type: PathPrefix
                value: /c
              headers:
                - type: Exact
                  name: route-a-b-header
                  value: route-a-b-header-val
              queryParams:
                - type: Exact
                  name: route-a-b-query
                  value: route-a-b-query-val
          backendRefs:
            - name: svc-a-b
              port: 8080
        - matches:
            - path:
                type: PathPrefix
                value: /d
              headers:
                - type: Exact
                  name: route-a-b-header-2
                  value: route-a-b-header-val-2
              queryParams:
                - type: Exact
                  name: route-a-b-query-2
                  value: route-a-b-query-val-2
          backendRefs:
            - group: gateway.networking.k8s.io
              kind: HTTPRoute
              name: route-a-b-d
              namespace: a-b-d
    status:
      parents:
        - controllerName: kgateway.dev/kgateway
          parentRef:
            group: gateway.networking.k8s.io
            kind: HTTPRoute
            name: route-a
            namespace: a
          conditions:
            - type: Accepted
              status: "True"
              reason: Accepted
              observedGeneration: 1
            - type: ResolvedRefs
              status: "True"
              reason: ResolvedRefs
              observedGeneration: 1
  - apiVersion: gateway.networking.k8s.io/v1
    kind: HTTPRoute
    metadata:
      name: route-a-b-d
      namespace: a-b-d
    spec:
      rules:
        - matches:
            - path:
                type: PathPrefix
                value: /a/b/d/1
              headers:
                - type: Exact
                  name: parent-header
                  value: parent-header-val
                - type: Exact
                  name: route-a-b-header-2
                  value: route-a-b-header-val-2
                - type: Exact
                  name: route-a-b-d-header
                  value: route-a-b-d-header-val
              queryParams:
                - type: Exact
                  name: parent-query
                  value: parent-query-val
                - type: Exact
                  name: route-a-b-query-2
                  value: route-a-b-query-val-2
                - type: Exact
                  name: route-a-b-d-query
                  value: route-a-b-d-query-val
              method: GET
          backendRefs:
            - name: svc-a-b-d
              port: 8080
    status:
      parents:
        - controllerName: kgateway.dev/kgateway
          parentRef:
            group: gateway.networking.k8s.io
            kind: HTTPRoute
            name: route-a-b
            namespace: a-b
          conditions:
            - type: Accepted
              status: "True"
              reason: Accepted
              observedGeneration: 1
            - type: ResolvedRefs
              status: "True"
              reason: ResolvedRefs
              observedGeneration: 1
expect:
  listeners:
    Gateway infra/example-gateway http: {count: 1}
  parentRefs:
    "HTTPRoute infra/example-route #0": {outcome: accepted}
  rows:
    infra/example-route 0.0 a/route-a: {outcome: attached}
    a/route-a 1.0 a-b/route-a-b: {outcome: attached}
    a-b/route-a-b 1.0 a-b-d/route-a-b-d:
      outcome: attached
      paths:
      - infra/example-route PathPrefix /a h:parent-header=parent-header-val q:parent-query=parent-query-val > a/route-a PathPrefix /a/b h:parent-header=parent-header-val q:parent-query=parent-query-val m:GET > a-b/route-a-b PathPrefix /a/b/d h:parent-header=parent-header-val h:route-a-b-header-2=route-a-b-header-val-2 q:parent-query=parent-query-val q:route-a-b-query-2=route-a-b-query-val-2 m:GET
  entries:
    "a/route-a {group: gateway.networking.k8s.io, kind: HTTPRoute, name: example-route, namespace: infra}": Accepted
    "a-b/route-a-b {group: gateway.networking.k8s.io, kind: HTTPRoute, name: route-a, namespace: a}": Accepted
    "a-b-d/route-a-b-d {group: gateway.networking.k8s.io, kind: HTTPRoute, name: route-a-b, namespace: a-b}": Accepted
  effective:
    a/route-a <- infra/example-route:
      contexts:
      - r0 PathPrefix /a/1 h:parent-header=parent-header-val h:route-a-header=route-a-header-val q:parent-query=parent-query-val q:route-a-query=route-a-query-val; r1 PathPrefix /a/b h:parent-header=parent-header-val q:parent-query=parent-query-val m:GET
    a-b/route-a-b <- a/route-a:
      contexts:
      - r0 PathPrefix /a/b/c h:parent-header=parent-header-val h:route-a-b-header=route-a-b-header-val q:parent-query=parent-query-val q:route-a-b-query=route-a-b-query-val m:GET; r1 PathPrefix /a/b/d h:parent-header=parent-header-val h:route-a-b-header-2=route-a-b-header-val-2 q:parent-query=parent-query-val q:route-a-b-query-2=route-a-b-query-val-2 m:GET
    a-b-d/route-a-b-d <- a-b/route-a-b:
      contexts:
      - r0 PathPrefix /a/b/d/1 h:parent-header=parent-header-val h:route-a-b-header-2=route-a-b-header-val-2 h:route-a-b-d-header=route-a-b-d-header-val q:parent-query=parent-query-val q:route-a-b-query-2=route-a-b-query-val-2 q:route-a-b-d-query=route-a-b-d-query-val m:GET
