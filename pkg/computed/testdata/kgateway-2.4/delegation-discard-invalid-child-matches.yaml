# Input: translator/gateway/testutils/inputs/delegation/discard_invalid_child_matches.yaml@v2.4.7 with its common.yaml, the
# Services left out. Status is copied from the output, with controllerName kgateway.dev/kgateway
# and without kgateway.dev/Programmed. Only route-a's /a/1 fits /a: route-a is
# attached with that rule, route-b is dropped and has no entry. One valid child, so no parent failure.
provenance: translator/gateway/testutils/outputs/delegation/discard_invalid_child_matches.yaml@v2.4.7
ruleOnly: true
controllerVersion: v2.4.7
namespaces:
  a: {}
  infra: {}
objects:
  - apiVersion: gateway.networking.k8s.io/v1
    kind: Gateway
    metadata:
      name: example-gateway
      namespace: infra
    spec:
      gatewayClassName: example-gateway-class
      listeners:
        - name: http
          protocol: HTTP
          port: 80
          allowedRoutes:
            namespaces:
              from: All
    status:
      conditions:
        - type: Accepted
          status: "True"
          reason: Accepted
          observedGeneration: 1
      listeners:
        - name: http
          attachedRoutes: 1
          conditions:
            - type: Accepted
              status: "True"
              reason: Accepted
              observedGeneration: 1
  - apiVersion: gateway.networking.k8s.io/v1
    kind: HTTPRoute
    metadata:
      name: example-route
      namespace: infra
    spec:
      parentRefs:
        - name: example-gateway
      hostnames:
        - example.com
      rules:
        - matches:
            - path:
                type: PathPrefix
                value: /a
          backendRefs:
            - group: gateway.networking.k8s.io
              kind: HTTPRoute
              name: '*'
              namespace: a
    status:
      parents:
        - controllerName: kgateway.dev/kgateway
          parentRef:
            name: example-gateway
          conditions:
            - type: Accepted
              status: "True"
              reason: Accepted
              observedGeneration: 1
            - type: ResolvedRefs
              status: "True"
              reason: ResolvedRefs
              observedGeneration: 1
  - apiVersion: gateway.networking.k8s.io/v1
    kind: HTTPRoute
    metadata:
      name: route-a
      namespace: a
    spec:
      rules:
        - matches:
            - path:
                type: PathPrefix
                value: /a/1
          backendRefs:
            - name: svc-a
              port: 8080
        - matches:
            - path:
                type: PathPrefix
                value: /random
          backendRefs:
            - name: svc-a
              port: 8080
    status:
      parents:
        - controllerName: kgateway.dev/kgateway
          parentRef:
            group: gateway.networking.k8s.io
            kind: HTTPRoute
            name: example-route
            namespace: infra
          conditions:
            - type: Accepted
              status: "True"
              reason: Accepted
              observedGeneration: 1
            - type: ResolvedRefs
              status: "True"
              reason: ResolvedRefs
              observedGeneration: 1
  - apiVersion: gateway.networking.k8s.io/v1
    kind: HTTPRoute
    metadata:
      name: route-b
      namespace: a
    spec:
      rules:
        - matches:
            - path:
                type: PathPrefix
                value: /random1
          backendRefs:
            - name: svc-a
              port: 8080
        - matches:
            - path:
                type: PathPrefix
                value: /random2
          backendRefs:
            - name: svc-a
              port: 8080
expect:
  listeners:
    Gateway infra/example-gateway http: {count: 1}
  parentRefs:
    "HTTPRoute infra/example-route #0": {outcome: accepted}
  rows:
    infra/example-route 0.0 a/route-a: {outcome: attached}
    infra/example-route 0.0 a/route-b: {outcome: dropped, reason: path-prefix}
  entries:
    "a/route-a {group: gateway.networking.k8s.io, kind: HTTPRoute, name: example-route, namespace: infra}": Accepted
  effective:
    a/route-a <- infra/example-route: {contexts: [r0 PathPrefix /a/1; r1 dropped path-prefix]}
    a/route-b <- infra/example-route: {contexts: [r0 dropped path-prefix; r1 dropped path-prefix]}
