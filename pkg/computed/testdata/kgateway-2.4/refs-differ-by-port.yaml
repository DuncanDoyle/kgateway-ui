# Two parentRefs that differ only by port share one route-accepted check (rules §7); view A
# computes each: both name a port no listener has, so both are NoMatchingParent.
# Status is hand-written to agree with view A (rules §8.3).
# The report key drops the port, so one status entry answers both refs.
provenance: computed-rules §4.1, §7, §11.1
controllerVersion: v2.4.7
namespaces:
  infra: {}
objects:
- apiVersion: gateway.networking.k8s.io/v1
  kind: Gateway
  metadata: {name: gw, namespace: infra}
  spec:
    gatewayClassName: kgateway
    listeners:
    - {name: http, protocol: HTTP, port: 80}
  status:
    listeners:
    - name: http
      attachedRoutes: 0
      conditions:
      - {type: Accepted, status: "True", reason: Accepted, observedGeneration: 1}
- apiVersion: gateway.networking.k8s.io/v1
  kind: HTTPRoute
  metadata: {name: r, namespace: infra}
  spec:
    parentRefs:
    - {name: gw, port: 90}
    - {name: gw, port: 91}
  status:
    parents:
    - controllerName: kgateway.dev/kgateway
      parentRef: {name: gw}
      conditions:
      - {type: Accepted, status: "False", reason: NoMatchingParent, observedGeneration: 1}
expect:
  listeners:
    Gateway infra/gw http: {count: 0}
  parentRefs:
    "HTTPRoute infra/r #0": {outcome: NoMatchingParent}
    "HTTPRoute infra/r #1": {outcome: NoMatchingParent}
  members: {}
  checks:
    Gateway infra/gw http: {state: checked, coverage: [count-agrees]}
    "HTTPRoute infra/r #0": {state: checked, coverage: [status-compatible]}
    "HTTPRoute infra/r #1": {state: checked, coverage: [status-compatible]}
  kgwui012: []
