# Experimental setting true: TCPRoute v1alpha2 (experimental-only) and v1 (watched
# regardless on 2.4) are both candidates.
# Status is hand-written to agree with view A (rules §8.3).
provenance: computed-rules §4.2, §11.1
controllerVersion: v2.4.7
settings:
  KGW_ENABLE_EXPERIMENTAL_GATEWAY_API_FEATURES: "true"
namespaces:
  infra: {}
objects:
- apiVersion: gateway.networking.k8s.io/v1
  kind: Gateway
  metadata: {name: gw, namespace: infra}
  spec:
    gatewayClassName: kgateway
    listeners:
    - {name: tcp, protocol: TCP, port: 9000}
    - {name: http, protocol: HTTP, port: 80}
  status:
    listeners:
    - name: tcp
      attachedRoutes: 2
      conditions:
      - {type: Accepted, status: "True", reason: Accepted, observedGeneration: 1}
    - name: http
      attachedRoutes: 1
      conditions:
      - {type: Accepted, status: "True", reason: Accepted, observedGeneration: 1}
- apiVersion: gateway.networking.k8s.io/v1alpha2
  kind: TCPRoute
  metadata: {name: c, namespace: infra}
  spec:
    parentRefs: [{name: gw}]
  status:
    parents:
    - controllerName: kgateway.dev/kgateway
      parentRef: {name: gw}
      conditions:
      - {type: Accepted, status: "True", reason: Accepted, observedGeneration: 1}
- apiVersion: gateway.networking.k8s.io/v1
  kind: TCPRoute
  metadata: {name: c1, namespace: infra}
  spec:
    parentRefs: [{name: gw}]
  status:
    parents:
    - controllerName: kgateway.dev/kgateway
      parentRef: {name: gw}
      conditions:
      - {type: Accepted, status: "True", reason: Accepted, observedGeneration: 1}
- apiVersion: gateway.networking.k8s.io/v1
  kind: HTTPRoute
  metadata: {name: h, namespace: infra}
  spec:
    parentRefs: [{name: gw}]
  status:
    parents:
    - controllerName: kgateway.dev/kgateway
      parentRef: {name: gw}
      conditions:
      - {type: Accepted, status: "True", reason: Accepted, observedGeneration: 1}
expect:
  listeners:
    Gateway infra/gw tcp: {count: 2}
    Gateway infra/gw http: {count: 1}
  parentRefs:
    "TCPRoute infra/c #0": {outcome: accepted, listeners: [tcp]}
    "TCPRoute infra/c1 #0": {outcome: accepted, listeners: [tcp]}
    "HTTPRoute infra/h #0": {outcome: accepted, listeners: [http]}
  checks:
    Gateway infra/gw tcp: {state: checked, coverage: [count-agrees]}
    Gateway infra/gw http: {state: checked, coverage: [count-agrees]}
    "TCPRoute infra/c #0": {state: checked, coverage: [status-compatible]}
    "TCPRoute infra/c1 #0": {state: checked, coverage: [status-compatible]}
    "HTTPRoute infra/h #0": {state: checked, coverage: [status-compatible]}
  kgwui012: []
