# Item 8a: mid-level parent c8p with a self-delegation (cycle, RefNotPermitted) before a missing Service (BackendNotFound).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: { name: api, namespace: shop, labels: { observe: d021 } }
spec:
  parentRefs: [{ name: edge, namespace: infra }]
  rules:
    - matches: [{ path: { type: PathPrefix, value: /api } }]
      backendRefs: [{ group: gateway.networking.k8s.io, kind: HTTPRoute, name: c8p, namespace: shop }]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: { name: c8p, namespace: shop, labels: { observe: d021 } }
spec:
  rules:
    - matches: [{ path: { type: PathPrefix, value: /api/p } }]
      backendRefs: [{ group: gateway.networking.k8s.io, kind: HTTPRoute, name: c8p, namespace: shop }]
    - matches: [{ path: { type: PathPrefix, value: /api/p/svc } }]
      backendRefs: [{ name: nosuch, port: 8000 }]
