# Item 10: attachedRoutes with a delegated child (c10), and a route on a ListenerSet.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: { name: api, namespace: shop, labels: { observe: d021 } }
spec:
  parentRefs: [{ name: edge, namespace: infra }]
  rules:
    - matches: [{ path: { type: PathPrefix, value: /api } }]
      backendRefs: [{ group: gateway.networking.k8s.io, kind: HTTPRoute, name: c10, namespace: shop }]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: { name: c10, namespace: shop, labels: { observe: d021 } }
spec:
  rules: [{ matches: [{ path: { type: PathPrefix, value: /api/ten } }], backendRefs: [{ name: httpbin, namespace: shop, port: 8000 }] }]
---
apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata: { name: ls, namespace: infra, labels: { observe: d021 } }
spec:
  parentRef: { name: edge }
  listeners: [{ name: extra, port: 8090, protocol: HTTP, allowedRoutes: { namespaces: { from: All } } }]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: { name: lsr, namespace: shop, labels: { observe: d021 } }
spec:
  parentRefs: [{ group: gateway.networking.k8s.io, kind: ListenerSet, name: ls, namespace: infra }]
  rules: [{ backendRefs: [{ name: httpbin, port: 8000 }] }]
