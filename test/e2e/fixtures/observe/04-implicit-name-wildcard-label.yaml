# Item 4: implicit children selected by name (c4n), wildcard (c4w), label (c4l) and label in all namespaces (c4a).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: { name: api, namespace: shop, labels: { observe: d021 } }
spec:
  parentRefs: [{ name: edge, namespace: infra }]
  rules:
    - matches: [{ path: { type: PathPrefix, value: /api/n } }]
      backendRefs: [{ group: gateway.networking.k8s.io, kind: HTTPRoute, name: c4n, namespace: shop }]
    - matches: [{ path: { type: PathPrefix, value: /api/w } }]
      backendRefs: [{ group: gateway.networking.k8s.io, kind: HTTPRoute, name: "*", namespace: orders }]
    - matches: [{ path: { type: PathPrefix, value: /api/l } }]
      backendRefs: [{ group: delegation.kgateway.dev, kind: label, name: team-x, namespace: shop }]
    - matches: [{ path: { type: PathPrefix, value: /api/a } }]
      backendRefs: [{ group: delegation.kgateway.dev, kind: label, name: everywhere, namespace: all }]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: { name: c4n, namespace: shop, labels: { observe: d021 } }
spec:
  rules: [{ matches: [{ path: { type: PathPrefix, value: /api/n/x } }], backendRefs: [{ name: httpbin, namespace: shop, port: 8000 }] }]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: { name: c4w, namespace: orders, labels: { observe: d021 } }
spec:
  rules: [{ matches: [{ path: { type: PathPrefix, value: /api/w/x } }], backendRefs: [{ name: httpbin, namespace: shop, port: 8000 }] }]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: { name: c4l, namespace: shop, labels: { observe: d021, delegation.kgateway.dev/label: team-x } }
spec:
  rules: [{ matches: [{ path: { type: PathPrefix, value: /api/l/x } }], backendRefs: [{ name: httpbin, namespace: shop, port: 8000 }] }]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: { name: c4a, namespace: wild, labels: { observe: d021, delegation.kgateway.dev/label: everywhere } }
spec:
  rules: [{ matches: [{ path: { type: PathPrefix, value: /api/a/x } }], backendRefs: [{ name: httpbin, namespace: shop, port: 8000 }] }]
