# Child-edit case 1, applied after 06a: the child's own match becomes /other, so c6 no longer fits the parent's /api.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: { name: c6, namespace: shop, labels: { observe: d021 } }
spec:
  rules: [{ matches: [{ path: { type: PathPrefix, value: /other/six } }], backendRefs: [{ name: httpbin, namespace: shop, port: 8000 }] }]
