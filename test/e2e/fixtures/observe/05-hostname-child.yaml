# Item 5: hostname-bearing children; c5d fails the fit, c5k fits.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: { name: api, namespace: shop, labels: { observe: d021 } }
spec:
  parentRefs: [{ name: edge, namespace: infra }]
  rules:
    - matches: [{ path: { type: PathPrefix, value: /api } }]
      backendRefs: [{ group: gateway.networking.k8s.io, kind: HTTPRoute, name: c5d, namespace: shop }]
    - matches: [{ path: { type: PathPrefix, value: /api } }]
      backendRefs: [{ group: gateway.networking.k8s.io, kind: HTTPRoute, name: c5k, namespace: shop }]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: { name: c5d, namespace: shop, labels: { observe: d021 } }
spec:
  hostnames: [a.example.com]
  rules: [{ matches: [{ path: { type: PathPrefix, value: /other } }], backendRefs: [{ name: httpbin, namespace: shop, port: 8000 }] }]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: { name: c5k, namespace: shop, labels: { observe: d021 } }
spec:
  hostnames: [b.example.com]
  rules: [{ matches: [{ path: { type: PathPrefix, value: /api/k } }], backendRefs: [{ name: httpbin, namespace: shop, port: 8000 }] }]
