# Item 3: explicit children whose parentRef sets sectionName (c3s) or only a port (c3p).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: { name: api, namespace: shop, labels: { observe: d021 } }
spec:
  parentRefs: [{ name: edge, namespace: infra }]
  rules:
    - matches: [{ path: { type: PathPrefix, value: /api/s } }]
      backendRefs: [{ group: gateway.networking.k8s.io, kind: HTTPRoute, name: c3s, namespace: shop }]
    - matches: [{ path: { type: PathPrefix, value: /api/p } }]
      backendRefs: [{ group: gateway.networking.k8s.io, kind: HTTPRoute, name: c3p, namespace: shop }]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: { name: c3s, namespace: shop, labels: { observe: d021 } }
spec:
  parentRefs: [{ group: gateway.networking.k8s.io, kind: HTTPRoute, name: api, namespace: shop, sectionName: http }]
  rules: [{ matches: [{ path: { type: PathPrefix, value: /api/s/x } }], backendRefs: [{ name: httpbin, namespace: shop, port: 8000 }] }]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: { name: c3p, namespace: shop, labels: { observe: d021 } }
spec:
  parentRefs: [{ group: gateway.networking.k8s.io, kind: HTTPRoute, name: api, namespace: shop, port: 8080 }]
  rules: [{ matches: [{ path: { type: PathPrefix, value: /api/p/x } }], backendRefs: [{ name: httpbin, namespace: shop, port: 8000 }] }]
