# Item 7, quirk 1: two delegation refs in one rule (c7a, c7b). Observed in the proxy's routes.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: { name: api, namespace: shop, labels: { observe: d021 } }
spec:
  parentRefs: [{ name: edge, namespace: infra }]
  rules:
    - matches: [{ path: { type: PathPrefix, value: /q1 } }]
      backendRefs: [{ group: gateway.networking.k8s.io, kind: HTTPRoute, name: c7a, namespace: shop }, { group: gateway.networking.k8s.io, kind: HTTPRoute, name: c7b, namespace: shop }]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: { name: c7a, namespace: shop, labels: { observe: d021 } }
spec:
  rules: [{ matches: [{ path: { type: PathPrefix, value: /q1/a } }], backendRefs: [{ name: httpbin, namespace: shop, port: 8000 }] }]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: { name: c7b, namespace: shop, labels: { observe: d021 } }
spec:
  rules: [{ matches: [{ path: { type: PathPrefix, value: /q1/b } }], backendRefs: [{ name: httpbin, namespace: shop, port: 8000 }] }]
