# Item 8c: a top-level parent with a working Service backendRef and an unresolved delegation ref.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: { name: api, namespace: shop, labels: { observe: d021 } }
spec:
  parentRefs: [{ name: edge, namespace: infra }]
  rules:
    - matches: [{ path: { type: PathPrefix, value: /api } }]
      backendRefs: [{ name: httpbin, port: 8000 }]
    - matches: [{ path: { type: PathPrefix, value: /api/d } }]
      backendRefs: [{ group: gateway.networking.k8s.io, kind: HTTPRoute, name: nonexistent, namespace: shop }]
