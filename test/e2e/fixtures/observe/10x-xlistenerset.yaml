# Item 10, legacy kind: a route on an XListenerSet (needs OBSERVE_XLISTENERSET=1 in setup.sh).
apiVersion: gateway.networking.x-k8s.io/v1alpha1
kind: XListenerSet
metadata: { name: xls, namespace: infra, labels: { observe: d021 } }
spec:
  parentRef: { name: edge }
  listeners: [{ name: legacy, port: 8091, protocol: HTTP, allowedRoutes: { namespaces: { from: All } } }]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: { name: xlsr, namespace: shop, labels: { observe: d021 } }
spec:
  parentRefs: [{ group: gateway.networking.x-k8s.io, kind: XListenerSet, name: xls, namespace: infra }]
  rules: [{ backendRefs: [{ name: httpbin, port: 8000 }] }]
