# Item 1, step a: the parent selects the implicit child c1 by name.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: { name: api, namespace: shop, labels: { observe: d021 } }
spec:
  parentRefs: [{ name: edge, namespace: infra }]
  rules:
    - matches: [{ path: { type: PathPrefix, value: /api } }]
      backendRefs: [{ group: gateway.networking.k8s.io, kind: HTTPRoute, name: c1, namespace: shop }]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: { name: c1, namespace: shop, labels: { observe: d021 } }
spec:
  rules: [{ matches: [{ path: { type: PathPrefix, value: /api/one } }], backendRefs: [{ name: httpbin, port: 8000 }] }]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: { name: c1b, namespace: shop, labels: { observe: d021 } }
spec:
  rules: [{ matches: [{ path: { type: PathPrefix, value: /api/other } }], backendRefs: [{ name: httpbin, port: 8000 }] }]
