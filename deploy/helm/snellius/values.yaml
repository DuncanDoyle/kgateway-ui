image:
  repository: ghcr.io/duncandoyle/snellius
  tag: ""            # defaults to the chart appVersion
  pullPolicy: IfNotPresent
install:
  # Pin the UI to one kgateway controller install: an install ID (e.g. kgw.kgateway)
  # or the controller's namespace/name. Empty shows all installs.
  pin: ""
delegation:
  # Selected delegation edges computed per install; 0 keeps the binary's
  # default (10000). A higher cap needs a higher memory limit.
  edgeCap: 0
# Data sources for the health checks. Each toggle drops its RBAC rule and its watch;
# the checks that need it then report "not available".
diagnostics:
  events: true       # Warning Events on controller and proxy Pods
  crds: true         # Gateway API CRD metadata
  proxyStats: true   # Envoy stats from each proxy Pod's port 9091
  endpoints: true    # Services and EndpointSlices (no check reads them yet)
  controllerLogs: false   # derived signals from controller logs; text is never kept
  controllerLogsNamespaces: [kgateway-system]   # a pods/log Role is created in each
# More flags for the UI binary, appended after the chart's own args,
# e.g. ["--poll-interval=10m"].
extraArgs: []
# Add-on hooks. All empty by default. Items are passed through unchanged.
rbac:
  # Rules appended to the ClusterRole. The operator's choice: these can widen
  # RBAC beyond the read-only default.
  extraRules: []
extraEnv: []            # env of the UI container
extraVolumes: []        # pod volumes
extraVolumeMounts: []   # mounts of the UI container
extraContainers: []     # sidecars added to the pod
# Trust model (D-013): the UI has no login. Anyone who reaches it sees everything
# its ServiceAccount can read (every watched kind, Deployments included, never
# Secrets), which can be more than their own Kubernetes RBAC allows.
httpRoute:
  # Expose the UI through an existing Gateway. Only enable this with
  # authentication and authorisation on the route, for example a kgateway
  # TrafficPolicy with OIDC or external auth that admits only operators.
  enabled: false
  parentRefs: []
  hostnames: []
serviceAccount:
  create: true
  name: ""
# Opt-in Go soft memory limit, rendered as GOMEMLIMIT (for example 300MiB). Empty sets none.
memoryLimit: ""
# With limits.memory the binary uses 90 % of it as its Go memory target.
resources:
  requests: { cpu: 50m, memory: 128Mi }
  limits: { memory: 512Mi }
podSecurityContext:
  runAsNonRoot: true
  seccompProfile: { type: RuntimeDefault }
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities: { drop: [ALL] }
