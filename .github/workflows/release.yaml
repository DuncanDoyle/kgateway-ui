name: release
on:
  push:
    # Semver tags only, optionally with a pre-release suffix.
    tags: ["v[0-9]+.[0-9]+.[0-9]+", "v[0-9]+.[0-9]+.[0-9]+-*"]
permissions: { contents: read }
jobs:
  image:
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - id: v
        # Tag vX.Y.Z publishes image X.Y.Z, matching the chart appVersion default.
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      # No qemu: both builder stages run on the build platform and the final stage has no RUN.
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ github.ref_name }}
          tags: ghcr.io/duncandoyle/snellius:${{ steps.v.outputs.version }}
  chart:
    runs-on: ubuntu-latest
    needs: image
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: azure/setup-helm@v5
      - name: package and push
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          helm package deploy/helm/snellius --version "$v" --app-version "$v"
          echo "$REGISTRY_TOKEN" | helm registry login ghcr.io -u "$REGISTRY_USER" --password-stdin
          helm push "snellius-$v.tgz" oci://ghcr.io/duncandoyle/charts
  github-release:
    runs-on: ubuntu-latest
    needs: chart
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      # The shell package is attached to the release, not published to a registry (private stays true).
      - name: shell package
        run: |
          (cd web && npm ci && npm pkg set version="${GITHUB_REF_NAME#v}" -w @kgateway-ui/shell)
          make shell-pack
      # Packed first, so the release is created with the shell package attached.
      - run: gh release create "$GITHUB_REF_NAME" --generate-notes "web/packages/shell/kgateway-ui-shell-${GITHUB_REF_NAME#v}.tgz"
        env: { GH_TOKEN: "${{ github.token }}" }
