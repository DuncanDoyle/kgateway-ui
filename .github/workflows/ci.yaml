name: ci
on:
  pull_request:
  push: { branches: [main] }
permissions: { contents: read }
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  hygiene:
    # Public repo: forbidden brand terms must never land (docs/phase-status.md, public-repo note).
    runs-on: ubuntu-latest
    env:
      FORBIDDEN_TERMS: ${{ vars.FORBIDDEN_TERMS }}
      EVENT_NAME: ${{ github.event_name }}
      BASE_REF: ${{ github.base_ref }}
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - name: forbidden terms
        run: |
          # The pattern lives in a repository variable so the list never lands here; never echo it.
          if [ -z "$FORBIDDEN_TERMS" ]; then
            echo "::warning::repository variable FORBIDDEN_TERMS is not available (fork PR?); skipping"; exit 0
          fi
          fail=0
          if git grep -inE -e "$FORBIDDEN_TERMS" -- . ':!web/package-lock.json' ':!go.sum'; then
            echo "::error::forbidden term found in tree"; fail=1
          fi
          if [ "$EVENT_NAME" = pull_request ] && git log --format=%B "origin/$BASE_REF..HEAD" | grep -inE -e "$FORBIDDEN_TERMS"; then
            echo "::error::forbidden term found in a commit message"; fail=1
          fi
          exit "$fail"
  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: spa
          # Hidden source maps stay out of the embedded SPA (internal/webui/embed_test.go).
          path: |
            web/app/dist
            !web/app/dist/**/*.map
          if-no-files-found: error
  go:
    runs-on: ubuntu-latest
    needs: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version-file: go.mod }
      - uses: actions/download-artifact@v8
        with: { name: spa, path: internal/webui/dist }
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@v9
        with: { version: v2.15.0 }
      # Chart tests run once, in the helm job.
      - run: |
          mapfile -t pkgs < <(go list ./... | grep -v /deploy/)
          REQUIRE_SPA=1 go test -race "${pkgs[@]}"
  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version-file: go.mod }
      - uses: azure/setup-helm@v5
      - run: helm lint deploy/helm/kgateway-ui
      - run: REQUIRE_HELM=1 go test ./deploy/...
  image:
    # Multi-arch build check; nothing is pushed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          platforms: linux/amd64,linux/arm64
